# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "es-ES"
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  auto_review:
    base_branches:
      - "develop"
      - "main"
    enabled: true
    drafts: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_instructions:
    - path: "**/*.kt"
      instructions: |
        - Toda consulta y endpoint debe filtrar por barbershop_id del usuario autenticado.
          Señala cualquier acceso por id sin validar la barbería (BOLA/IDOR).
        - Fechas: guardar en UTC (timestamptz / Instant), mostrar en America/Bogota.
          Señala LocalDateTime usado para instantes reales.
        - Dinero en COP como Long, nunca Double ni Float.
        - Nunca registrar en logs teléfonos, nombres ni llaves de Wompi.
        - Webhooks de Wompi: validar checksum y consultar estado antes de confirmar.
    - path: "src/main/resources/db/migration/**"
      instructions: |
        - Nunca modificar una migración ya aplicada; crear una nueva.
        - Toda tabla nueva con barbershop_id lleva ENABLE + FORCE RLS y su política en la misma migración.
        - Excepciones deliberadas sin RLS: staff_membership y customer_identity son directorios
          de identidad global con barbershop_id. Login, vinculación por teléfono verificado,
          historial y borrado de cuenta requieren recorrer barberías, incluidas inactivas.
          Su acceso debe filtrar por usuario autenticado o teléfono verificado; no por ids libres.
        - Toda tabla nueva lleva barbershop_id e índice, salvo barbershop y las tablas
          globales explícitas app_user, otp_challenge y refresh_token. Estas últimas
          identifican usuarios y credenciales compartidos entre barberías; no añadirles
          barbershop_id. Cualquier otra excepción requiere revisión explícita.
chat:
  auto_reply: true
