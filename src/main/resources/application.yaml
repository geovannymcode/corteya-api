spring:
  application:
    name: corteya-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/corteya}
    username: ${DB_USERNAME:corteya}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
